name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 3 * *'

permissions:
  contents: read

jobs:
  build:
    # Run on several macOS images to catch source and toolchain regressions. CI exercises
    # bundle loading and offscreen rendering, but cannot run System Settings' screensaver UI.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16.2 on macOS 14
        # Tests use Swift Testing, which is supplied by Xcode 16 and later.
        if: matrix.os == 'macos-14'
        run: sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer

      - name: Environment
        run: |
          sw_vers
          uname -m
          swift --version
          xcode-select -p

      - name: Lints
        # Check the rendering-framework and portable-core boundaries before building.
        run: make check

      - name: Test
        run: swift test

      - name: Golden smoke suite
        run: make smoke

      - name: Build the screensaver bundle
        run: make saver

      - name: Build the standalone app
        run: make app

      - name: Verify the bundle loads and its principal class resolves
        # Loading the bundle verifies that its principal class resolves; compilation alone
        # does not exercise this Info.plist requirement. Building a view and asking it for
        # its Options sheet covers the settings path the same way a host would.
        run: |
          cat > /tmp/loadtest.swift <<'EOF'
          import AppKit
          import Foundation
          import ScreenSaver
          let path = CommandLine.arguments[1]
          guard let bundle = Bundle(path: path) else { print("FAIL: not a bundle"); exit(1) }
          guard bundle.load() else { print("FAIL: bundle.load() returned false"); exit(1) }
          guard let cls = bundle.principalClass else {
              print("FAIL: principalClass is nil - this is the blank grey screensaver")
              exit(1)
          }
          guard cls is NSView.Type else { print("FAIL: not an NSView subclass"); exit(1) }
          guard let saverClass = cls as? ScreenSaverView.Type else {
              print("FAIL: not a ScreenSaverView subclass"); exit(1)
          }
          guard let view = saverClass.init(frame: NSRect(x: 0, y: 0, width: 640, height: 400),
                                           isPreview: true) else {
              print("FAIL: init(frame:isPreview:) returned nil"); exit(1)
          }
          guard view.hasConfigureSheet else { print("FAIL: hasConfigureSheet is false"); exit(1) }
          guard let sheet = view.configureSheet else { print("FAIL: configureSheet is nil"); exit(1) }
          let size = sheet.contentView?.frame.size ?? .zero
          guard size.width > 0, size.height > 0 else {
              print("FAIL: the Options sheet has no content: \(size)"); exit(1)
          }
          print("OK: \(cls), Options sheet \(size)")
          EOF
          swiftc -o /tmp/loadtest /tmp/loadtest.swift
          /tmp/loadtest build/Cowsaver.saver

      - name: Verify the fail-safe render path
        # The compiled fallback must render when bundled resources are unavailable.
        run: |
          cp -R build/Cowsaver.app /tmp/Stripped.app
          rm -rf /tmp/Stripped.app/Contents/Resources
          mkdir -p /tmp/neutral && cd /tmp/neutral
          /tmp/Stripped.app/Contents/MacOS/Cowsaver --render-to-png /tmp/stripped.png
          test -s /tmp/stripped.png

      - name: Doctor
        run: make doctor

  fidelity:
    # Regenerate fixtures from cowsay 3.8.4 and require the committed files to match.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Remove unrelated preinstalled tap
        run: |
          tap_directory="$(brew --repository)/Library/Taps/aws/homebrew-tap"
          if [ -d "$tap_directory" ]; then
            brew untap aws/tap
          fi

      - name: Install cowsay
        run: brew install cowsay

      - name: Regenerate the goldens and require zero diff
        run: |
          if ! cowsay --version 2>&1 | grep -q "version 3.8.4"; then
            echo "::error::Homebrew's cowsay is no longer 3.8.4; cannot verify the pinned fixtures."
            cowsay --version
            exit 1
          fi
          make golden
          if ! git diff --quiet -- Tests/CowsayKitTests/Golden; then
            echo "::error::Regenerating from real cowsay changed the committed goldens."
            git diff --stat -- Tests/CowsayKitTests/Golden
            exit 1
          fi
          echo "goldens reproduce exactly from cowsay 3.8.4"
